<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd: suwak w hero Kwiaciarni Małgorzata</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/am.css">
<link rel="stylesheet" href="swipe/am-swipe.css?v=4">
<style>
  body{background:#FBF7F4}
  .demo{min-height:100svh;display:grid;align-items:center;padding:6rem 0 3rem;background:radial-gradient(70% 60% at 85% 40%,#F6E3E0 0%,#FBF7F4 70%)}
  .demo .wrap{display:grid;gap:2.5rem}
  .demo .lock{width:min(100%,24rem)}
  .demo h1{font-size:clamp(2.4rem,6vw,4.2rem);color:#2F2A2B}
  .demo h1 em{font-style:italic;color:#C24468}
  .demo p.lead{color:#6B6164;max-width:32rem;margin-top:1rem;font-size:1.0625rem}
  .note{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#2F2A2B;color:#fff;font:500 .75rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:.6rem 1rem;border-radius:99px;z-index:5;white-space:nowrap}
  .demo .photo{border-radius:1.25rem;overflow:hidden;aspect-ratio:4/5;max-height:70svh;background:#F6E3E0}
  .demo .photo img{width:100%;height:100%;object-fit:cover}
  @media (min-width:56em){.demo .wrap{grid-template-columns:1.1fr 1fr;align-items:center}}
</style>
</head>
<body>
<p class="note">Podgląd hero strony Kwiaciarni Małgorzata</p>
<main class="demo">
  <div class="wrap">
    <div>
      <img class="lock" src="logo/lockup-am-x-malgorzata.svg" width="2333" height="926" alt="AM Flowers i Kwiaciarnia Małgorzata">
      <h1 style="margin-top:2rem">Bukiety, które <em>mówią za Ciebie</em></h1>
      <p class="lead">Wiązanki, kompozycje i dekoracje ze świeżych kwiatów. Pracownia przy ul. Iwaszkiewicza 137B w Oławie.</p>
      <div style="margin-top:2.5rem">
        <div class="am-swipe" data-href="index.html" data-asset-base=""></div>
      </div>
    </div>
    <div class="photo"><img src="img/f7-800.webp" alt="Bukiet w kremowym papierze"></div>
  </div>
</main>
<script src="swipe/am-swipe.js?v=4" defer></script>
</body>
</html>
